<text x="946" y="129" fill="#617654" font-size="10" font-weight="700">Textdesk</text><rect x="1163" y="116" width="37" height="17" rx="4" fill="#e7efdf"/><text x="1181.5" y="127.5" fill="#6e865e" font-size="8" text-anchor="middle">Files</text>
<text x="925" y="162" fill="#6e815f" font-size="10" font-weight="700">Saved files</text>
<rect x="925" y="177" width="20" height="25" rx="4" fill="#e8efdf"/><text x="935" y="193" fill="#839b70" font-size="6" font-weight="700" text-anchor="middle">PDF</text>
<text x="955" y="188" fill="#61784f" font-size="10">report.pdf</text><text x="955" y="202" fill="#a4b298" font-size="8">2.4 MB · Saved in cloud</text>
<rect x="1126" y="180" width="72" height="23" rx="5" fill="#355b44"/><text x="1162" y="195" fill="#f7fff0" font-size="8.5" text-anchor="middle">Download</text>
<path d="M925 216h273" stroke="#e7edde"/><rect x="925" y="228" width="20" height="25" rx="4" fill="#e8efdf"/><text x="935" y="244" fill="#839b70" font-size="6" font-weight="700" text-anchor="middle">TXT</text>
<text x="955" y="239" fill="#61784f" font-size="10">notes.txt</text><text x="955" y="253" fill="#a4b298" font-size="8">4 KB · Saved in cloud</text>
<rect x="1126" y="231" width="72" height="23" rx="5" fill="#f4f8ee" stroke="#d8e3cd"/><text x="1162" y="246" fill="#6e865e" font-size="8.5" text-anchor="middle">Download</text>
<path d="M887 309h349l-10 13H897l-10-13Z" fill="#e0e8d8" stroke="#bfceb3" stroke-linejoin="round"/><path d="M1034 310h58l-5 5h-48l-5-5Z" fill="#c7d5bb"/>
</g>
<text x="956" y="356" fill="#8b9c7e" font-size="12" text-anchor="middle" letter-spacing=".2">Same link. Any device.</text>
</g></svg>
