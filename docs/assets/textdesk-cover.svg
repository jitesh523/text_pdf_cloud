<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
<title id="title">Textdesk — from phone to laptop</title>
<desc id="desc">An illustration of a phone uploading report.pdf and a laptop downloading it, beside Textdesk cloud notebook branding.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f4ef"/><stop offset="1" stop-color="#edf3e6"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dy="8" stdDeviation="9" flood-color="#355b44" flood-opacity=".09"/></filter>
</defs>
<rect x="1" y="1" width="1278" height="388" rx="22" fill="url(#bg)" stroke="#dfe5d6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="58" y="51" fill="#7e8e71" font-size="11" font-weight="700" letter-spacing="2.5">YOUR WORDS. YOUR FILES. YOUR SPACE.</text>
<rect x="58" y="79" width="49" height="49" rx="12" fill="#355b44"/>
<path d="M70 93h25M82.5 93v23M76 116h13M70 98v-5M95 98v-5" fill="none" stroke="#fafff4" stroke-width="2" stroke-linecap="round"/>
<text x="123" y="123" fill="#30372f" font-size="57" font-weight="700" letter-spacing="-2.5">Textdesk<tspan fill="#729365">.</tspan></text>
<text x="58" y="183" fill="#355b44" font-size="29" font-weight="600" letter-spacing="-.7">From phone to laptop.</text>
<text x="58" y="222" fill="#78866d" font-size="17">A shared cloud notebook and file bridge.</text>
<text x="58" y="249" fill="#78866d" font-size="17">One link. No sign-in. Pick up where you left off.</text>
<rect x="58" y="286" width="174" height="37" rx="18.5" fill="#e3ebdc" stroke="#d7e2ce"/>
<circle cx="77" cy="304.5" r="3.5" fill="#779a67"/><text x="89" y="309" fill="#4b6c3b" font-size="12" font-weight="600">Cloud autosave</text>
<rect x="244" y="286" width="185" height="37" rx="18.5" fill="#f9fbf4" stroke="#dce5d3"/>
<text x="264" y="309" fill="#6e825e" font-size="12" font-weight="600">Files up to 100 MB each</text>
<g filter="url(#shadow)">
<rect x="690" y="57" width="147" height="263" rx="26" fill="#e2e8dc" stroke="#bdcbb2" stroke-width="1.5"/>
<rect x="697" y="64" width="133" height="249" rx="20" fill="#fdfef8"/>
<rect x="742" y="72" width="42" height="5" rx="2.5" fill="#c3cfb9"/>
<text x="712" y="108" fill="#355b44" font-size="15" font-weight="700">Files</text><circle cx="811" cy="103" r="3" fill="#8ca77a"/>
<rect x="709" y="126" width="109" height="77" rx="8" fill="#f0f5e8" stroke="#d5e1c9" stroke-dasharray="3 3"/>
<path d="M763.5 141v21m-7-14 7-7 7 7M753 167h21" fill="none" stroke="#789864" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="763.5" y="188" fill="#6b885a" font-size="10" text-anchor="middle">Upload files</text>
<rect x="709" y="216" width="109" height="40" rx="6" fill="#fbfdf7" stroke="#e0e8d8"/>
<rect x="717" y="224" width="22" height="24" rx="4" fill="#e6eedf"/>
<path d="M724 231h8m-8 5h8m-8 5h5" stroke="#8aa079" stroke-width="1.2" stroke-linecap="round"/>
<text x="747" y="233" fill="#60794f" font-size="9" font-weight="600">report.pdf</text><text x="747" y="247" fill="#a0ad94" font-size="8">2.4 MB</text>
<circle cx="720" cy="279" r="3" fill="#8aa675"/><text x="730" y="282" fill="#6f8b5f" font-size="9">Saved to cloud</text>
<rect x="746" y="300" width="35" height="3" rx="1.5" fill="#d5decb"/>
</g>
<path d="M846 184h45m-6-5 6 5-6 5" fill="none" stroke="#9aaf89" stroke-width="1.7" stroke-dasharray="3 5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M857 159h16a7 7 0 0 0 0-14 10 10 0 0 0-19-1 7.5 7.5 0 0 0 3 15Z" fill="#edf3e6" stroke="#94aa83" stroke-width="1.3"/>
<g filter="url(#shadow)">
<rect x="903" y="100" width="317" height="209" rx="12" fill="#dfe7d7" stroke="#bfcfb3" stroke-width="1.5"/>
<rect x="910" y="107" width="303" height="195" rx="6" fill="#fdfef8"/><path d="M910 141h303" stroke="#e2e9da"/>
